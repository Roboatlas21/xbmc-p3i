name: CoreELEC 21 NG ARM32 native build

# Cheap source checks run on every branch push in coreelec-ng-checks.yml.
# Native rebuild trigger: preserve common-c's pinned ENet submodule.
# Native rebuild trigger: dependency-cache fallback for Moonlight-only recipe changes.
# Native rebuild trigger: Skupi-era moonlight-common-c with nanoRS/LTR/RFI fixes.
# Native rebuild trigger: full Amlogic teardown before Kodi restart.
# Native rebuild trigger: CoreELEC NG OSD overlay-plane handoff.
# Native rebuild trigger: CoreELEC libCEC 6 runtime compatibility and HTTP timeout.
# Native rebuild trigger: CoreELEC cec_input local Back handling.
# Native rebuild trigger: bundle CoreELEC libCEC runtime for Luna.
# Native rebuild trigger: UR-02 navigation remote Back handling.
# Native builds are deliberately manual; a workflow-only push is also an explicit build trigger.
on:
  push:
    branches:
      - feat/coreelec-ng
    paths:
      - .github/workflows/coreelec-ng-native.yml
  workflow_dispatch:
    inputs:
      clean_build:
        description: Ignore reusable toolchain/dependency checkpoints (diagnostic clean build)
        type: boolean
        default: false
      build_vfm_runtime:
        description: Build complete experimental VFM runtime and installable Luna addon
        type: boolean
        default: false

permissions:
  contents: read

# Do not kill a lengthy build when another commit gets pushed.
concurrency:
  group: native-ng-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify source, Pannal overlay and diagnostic runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f third_party/moonlight-common-c/src/Limelight.h
          bash -n packaging/coreelec-ng/prepare-build.sh
          bash -n packaging/coreelec-ng/collect-native.sh
          bash -n packaging/coreelec-ng/build-stage.sh
          bash -n packaging/coreelec-ng/fix-rtmpdump-source.sh
          bash tests/test_rtmpdump_source.sh
          bash -n packaging/coreelec-ng/patch-host-flags.sh
          bash -n packaging/coreelec-ng/check-host-tools.sh
          bash tests/test_host_portability.sh
          bash tests/test_coreelec_ng_build_stage.sh
          bash tests/test_coreelec_ng_collect_native.sh
          # Verify new runtime packaging contract before an expensive ARM32 job.
          python3 -m unittest discover -s tests -p 'test_runtime_manifest.py' -v
          python3 -m unittest discover -s tests -p 'test_vfm_runtime_build.py' -v
          bash -n packaging/coreelec-ng/vfm/prepare-build.sh
          bash -n packaging/coreelec-ng/vfm/smoke-runtime.sh
          test -s third_party/SDL_GameControllerDB/gamecontrollerdb.txt
          grep -Fq 'runtime_manifest.py' packaging/coreelec-ng/collect-native.sh
          grep -Fq 'install_pkg/moonlight-embedded-2.7.1-ng-local' packaging/coreelec-ng/collect-native.sh
          grep -Fq 'ENABLE_CORE_ELEC_AUDIO_MAPPING=ON' packaging/coreelec-ng/package.mk
          grep -Fq 'ENABLE_FFMPEG=OFF' packaging/coreelec-ng/package.mk

  native:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PROJECT: Amlogic-ce
      DEVICE: Amlogic-ng
      ARCH: arm
      CORE_ELEC_REF: 872edca4dd5a7c5d6344e785d7358766834d7119
      MOONLIGHT_BUILD_VFM: ${{ inputs.build_vfm_runtime == true && 'yes' || 'no' }}
      # Package stamps make cached build output reusable without retaining
      # huge, redundant ccache object files.
      CCACHE_DISABLE: '1'
    steps:
      - name: Check out the private Moonlight fork
        uses: actions/checkout@v4
        with:
          path: moonlight
          submodules: recursive
          persist-credentials: false

      - name: Check out Pannal's CoreELEC build recipes
        uses: actions/checkout@v4
        with:
          repository: pannal/CoreELEC
          ref: 872edca4dd5a7c5d6344e785d7358766834d7119
          path: CoreELEC
          persist-credentials: false

      - name: Check out Pannal's NG 4.9 kernel sources
        uses: actions/checkout@v4
        with:
          repository: pannal/linux-amlogic
          ref: 2d0e0cc0db958d8d88f76407ac922f08d9a4004e
          path: linux-amlogic-local
          persist-credentials: false

      - name: Check out Pannal's NG media modules
        uses: actions/checkout@v4
        with:
          repository: pannal/media_modules-aml
          ref: 47d0ec45bbc2d659d675e3a0269788be1470e1f7
          path: CoreELEC/sources/media_modules-aml/media_modules-aml-local
          persist-credentials: false

      # Read an immutable existing export; do not update the snapshot fork.
      # This avoids requiring a second private-repository token for Luna.
      - name: Resolve pinned Luna public export
        if: ${{ inputs.build_vfm_runtime == true }}
        id: luna_export
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          pins = json.loads(Path('moonlight/packaging/coreelec-ng/vfm/sources.json').read_text())
          sha = pins['Luna_public_export']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid Luna public export pin')
          print('sha=' + sha)
          PY

      - name: Read pinned Luna packaging source
        if: ${{ inputs.build_vfm_runtime == true }}
        uses: actions/checkout@v4
        with:
          repository: Roboatlas21/xbmc-p3i
          ref: ${{ steps.luna_export.outputs.sha }}
          path: luna-source
          sparse-checkout: moonlight-build
          persist-credentials: false

      - name: Verify pinned Luna packaging source
        if: ${{ inputs.build_vfm_runtime == true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          pins = json.loads(Path(
              'moonlight/packaging/coreelec-ng/vfm/sources.json').read_text())
          lock = json.loads(Path(
              'luna-source/moonlight-build/source-lock.json').read_text())
          expected_export = pins['Luna_public_export']
          actual_export = subprocess.check_output(
              ['git', '-C', 'luna-source', 'rev-parse', 'HEAD'],
              text=True).strip()
          if actual_export != expected_export:
              raise SystemExit(
                  'Luna public export checkout mismatch: expected %s, got %s'
                  % (expected_export, actual_export))
          actual_luna = lock['sources']['luna']['revision']
          if actual_luna != pins['Luna']:
              raise SystemExit(
                  'Luna source revision mismatch: expected %s, got %s'
                  % (pins['Luna'], actual_luna))
          print('Verified Luna export %s -> source %s'
                % (actual_export, actual_luna))
          PY

      - name: Wire up Pannal's local kernel checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f linux-amlogic-local/Makefile
          test -f CoreELEC/sources/media_modules-aml/media_modules-aml-local/Makefile
          test ! -e "$HOME/linux-amlogic-local"
          ln -s "$GITHUB_WORKSPACE/linux-amlogic-local" "$HOME/linux-amlogic-local"

      - name: Reclaim unused runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h "$GITHUB_WORKSPACE"

      - name: Install host build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 git make rsync bc gawk gperf gettext \
            libssl-dev libxml2-utils libxml-parser-perl groff unzip zip xz-utils \
            cpio patch curl file kmod qemu-user lzop

      - name: Prepare the local Moonlight recipe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C moonlight rev-parse HEAD)" = "$GITHUB_SHA"
          bash moonlight/packaging/coreelec-ng/prepare-build.sh "$GITHUB_WORKSPACE/CoreELEC"
          grep -Fxq 'HOST_CFLAGS="-march=x86-64 -mtune=generic -O2 -Wall -pipe -I$TOOLCHAIN/include"' CoreELEC/config/optimize
          grep -Fq 'ENABLE_CORE_ELEC_AUDIO_MAPPING=ON' \
            CoreELEC/packages/addons/addon-depends/moonlight-embedded/package.mk
          test ! -e CoreELEC/packages/addons/addon-depends/moonlight-embedded/patches/01-surround-fix.patch

      - name: Fetch and verify pinned rtmpdump source before expensive build
        shell: bash
        run: |
          set -euo pipefail
          bash moonlight/packaging/coreelec-ng/fix-rtmpdump-source.sh             "$GITHUB_WORKSPACE/CoreELEC" --fetch

      - name: Fingerprint the exact native build environment
        id: keys
        shell: bash
        run: |
          set -euo pipefail
          # Immutable git revisions prevent a moving Pannal branch from
          # reusing incompatible compiler/sysroot binaries.
          {
            git -C CoreELEC rev-parse HEAD
            git -C linux-amlogic-local rev-parse HEAD
            git -C CoreELEC/sources/media_modules-aml/media_modules-aml-local rev-parse HEAD
            # v2 cached -march=native host tools (including a SIGILL sed),
            # which cannot safely run across heterogeneous hosted CPUs.
            printf '%s\n' 'Amlogic-ce/Amlogic-ng/arm' 'ubuntu-24.04' 'ccache-off' 'cache-layout-v3-portable-x86-64'
            sha256sum moonlight/packaging/coreelec-ng/patch-host-flags.sh
          } > "$RUNNER_TEMP/ng-environment.txt"
          base="$(sha256sum "$RUNNER_TEMP/ng-environment.txt" | cut -c1-24)"
          # Dependency caches reflect the exact downstream rtmpdump patch,
          # while the saved toolchain cache stays independent/reusable.
          recipe="$(cat moonlight/packaging/coreelec-ng/package.mk \
            moonlight/packaging/coreelec-ng/fix-rtmpdump-source.sh \
            moonlight/packaging/coreelec-ng/vfm/* \
            moonlight/kernel/moonlight-vfm/* | sha256sum | cut -c1-24)"
          {
            echo "base=$base"
            echo "toolchain=ce21-ng-toolchain-$base"
            echo "half=ce21-ng-deps-half-$base-vfm-$MOONLIGHT_BUILD_VFM-$recipe"
            echo "full=ce21-ng-deps-full-$base-vfm-$MOONLIGHT_BUILD_VFM-$recipe"
          } >> "$GITHUB_OUTPUT"
          echo '### CoreELEC NG native environment' >> "$GITHUB_STEP_SUMMARY"
          echo "- CoreELEC: \`$(git -C CoreELEC rev-parse --short=12 HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kernel: \`$(git -C linux-amlogic-local rev-parse --short=12 HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Media modules: \`$(git -C CoreELEC/sources/media_modules-aml/media_modules-aml-local rev-parse --short=12 HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Host compiler ISA: portable x86-64 baseline; previous runner-specific cache invalidated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cache bypass requested: \`${{ inputs.clean_build == true }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore completed dependency checkpoint
        if: ${{ inputs.clean_build != true }}
        id: full-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            CoreELEC/build.*
            !CoreELEC/build.*/.ccache/**
            !CoreELEC/build.*/.ccache-local/**
          key: ${{ steps.keys.outputs.full }}
          # Reuse the newest compatible CoreELEC dependency checkpoint when
          # only Moonlight's own recipe changed. A prefix restore reports
          # cache-hit=false, so the staged build still validates package stamps.
          restore-keys: |
            ce21-ng-deps-full-${{ steps.keys.outputs.base }}-

      - name: Restore first dependency checkpoint
        if: ${{ inputs.clean_build != true && steps.full-cache.outputs.cache-hit != 'true' }}
        id: half-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            CoreELEC/build.*
            !CoreELEC/build.*/.ccache/**
            !CoreELEC/build.*/.ccache-local/**
          key: ${{ steps.keys.outputs.half }}
          restore-keys: |
            ce21-ng-deps-half-${{ steps.keys.outputs.base }}-

      - name: Restore compiled ARM32 toolchain checkpoint
        if: ${{ inputs.clean_build != true && steps.full-cache.outputs.cache-hit != 'true' && steps.half-cache.outputs.cache-hit != 'true' }}
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            CoreELEC/build.*
            !CoreELEC/build.*/.ccache/**
            !CoreELEC/build.*/.ccache-local/**
          key: ${{ steps.keys.outputs.toolchain }}

      - name: Build ARM32 toolchain (first run only)
        if: ${{ steps.full-cache.outputs.cache-hit != 'true' && steps.half-cache.outputs.cache-hit != 'true' && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        shell: bash
        timeout-minutes: 180
        run: bash moonlight/packaging/coreelec-ng/build-stage.sh toolchain "$GITHUB_WORKSPACE/CoreELEC" "$GITHUB_WORKSPACE/moonlight/native-build-logs"

      - name: Smoke-test restored or newly built portable host utilities
        shell: bash
        run: |
          set -euo pipefail
          bash moonlight/packaging/coreelec-ng/check-host-tools.sh "$GITHUB_WORKSPACE/CoreELEC"

      - name: Save compiled toolchain checkpoint
        if: ${{ inputs.clean_build != true && steps.full-cache.outputs.cache-hit != 'true' && steps.half-cache.outputs.cache-hit != 'true' && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            CoreELEC/build.*
            !CoreELEC/build.*/.ccache/**
            !CoreELEC/build.*/.ccache-local/**
          key: ${{ steps.keys.outputs.toolchain }}

      - name: Build first half of native dependencies
        if: ${{ steps.full-cache.outputs.cache-hit != 'true' && steps.half-cache.outputs.cache-hit != 'true' }}
        shell: bash
        timeout-minutes: 140
        run: bash moonlight/packaging/coreelec-ng/build-stage.sh deps-first "$GITHUB_WORKSPACE/CoreELEC" "$GITHUB_WORKSPACE/moonlight/native-build-logs"

      - name: Save first dependency checkpoint
        if: ${{ inputs.clean_build != true && steps.full-cache.outputs.cache-hit != 'true' && steps.half-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            CoreELEC/build.*
            !CoreELEC/build.*/.ccache/**
            !CoreELEC/build.*/.ccache-local/**
          key: ${{ steps.keys.outputs.half }}

      - name: Build remaining native dependencies
        if: ${{ steps.full-cache.outputs.cache-hit != 'true' }}
        shell: bash
        timeout-minutes: 140
        run: bash moonlight/packaging/coreelec-ng/build-stage.sh deps-final "$GITHUB_WORKSPACE/CoreELEC" "$GITHUB_WORKSPACE/moonlight/native-build-logs"

      - name: Build private FFmpeg, stock decoder modules and VFM bridge
        if: ${{ inputs.build_vfm_runtime == true }}
        shell: bash
        timeout-minutes: 180
        run: |
          set -euo pipefail
          # Source-dependent stamps are checked even after a cache hit.
          bash moonlight/packaging/coreelec-ng/build-stage.sh vfm \
            "$GITHUB_WORKSPACE/CoreELEC" "$GITHUB_WORKSPACE/moonlight/native-build-logs"

      - name: Save completed dependency checkpoint
        if: ${{ inputs.clean_build != true && steps.full-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            CoreELEC/build.*
            !CoreELEC/build.*/.ccache/**
            !CoreELEC/build.*/.ccache-local/**
          key: ${{ steps.keys.outputs.full }}

      - name: Compile Moonlight against CoreELEC NG ARM32
        shell: bash
        timeout-minutes: 65
        run: |
          set -euo pipefail
          # Environment toggles are not part of CoreELEC's package stamp.
          (cd CoreELEC && ./scripts/clean moonlight-embedded)
          bash moonlight/packaging/coreelec-ng/build-stage.sh moonlight \
            "$GITHUB_WORKSPACE/CoreELEC" "$GITHUB_WORKSPACE/moonlight/native-build-logs"

      - name: Collect validated ARM ELF32 executable and libraries
        shell: bash
        env:
          SOURCE_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash moonlight/packaging/coreelec-ng/collect-native.sh \
            "$GITHUB_WORKSPACE/CoreELEC" "$GITHUB_WORKSPACE/native"
          cat native/build-info.txt

      - name: Collect and smoke-test the complete VFM runtime
        if: ${{ inputs.build_vfm_runtime == true }}
        shell: bash
        env:
          SOURCE_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 moonlight/packaging/coreelec-ng/vfm/collect-runtime.py CoreELEC vfm
          bash moonlight/packaging/coreelec-ng/vfm/smoke-runtime.sh CoreELEC vfm
          tar -czf native/moonlight-coreelec21-ng-vfm-runtime.tar.gz -C vfm .

      - name: Package installable Luna addon with VFM included
        if: ${{ inputs.build_vfm_runtime == true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 moonlight/packaging/coreelec-ng/vfm/package-addon.py \
            luna-source/moonlight-build native/moonlight-coreelec21-ng-arm32.tar.gz \
            vfm native/luna-coreelec21-ng-vfm.zip
          {
            echo '### Complete experimental VFM addon'
            echo '- Install `luna-coreelec21-ng-vfm.zip` from the `luna-coreelec21-ng-vfm-addon` artifact.'
            echo '- Select Advanced settings → Video pipeline → FFmpeg / VFM (experimental).'
            echo '- Private ARM32 FFmpeg/plugin and dependency-ordered ARM64 modules are included.'
            echo '- No CoreELEC image, kernel or device-tree replacement is packaged.'
            echo '- QEMU checks userspace dependencies; device decoding, display and teardown still need testing.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete VFM runtime and installable addon
        if: ${{ inputs.build_vfm_runtime == true }}
        uses: actions/upload-artifact@v4
        with:
          name: luna-coreelec21-ng-vfm-addon
          path: |
            native/luna-coreelec21-ng-vfm.zip
            native/moonlight-coreelec21-ng-vfm-runtime.tar.gz
            vfm/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload native ARM32 artifact for Luna packaging
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-coreelec21-ng-arm32
          path: |
            native/moonlight-coreelec21-ng-arm32.tar.gz
            native/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload compact diagnostics (and full failed-package log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coreelec-ng-build-logs
          path: moonlight/native-build-logs/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

      - name: Summarize cache usage and disk space
        if: always()
        shell: bash
        run: |
          {
            echo '### Native build cache'
            echo "- Full dependencies restored: \`${{ steps.full-cache.outputs.cache-hit == 'true' }}\`"
            echo "- Half dependencies restored: \`${{ steps.half-cache.outputs.cache-hit == 'true' }}\`"
            echo "- Toolchain restored: \`${{ steps.toolchain-cache.outputs.cache-hit == 'true' }}\`"
            echo '- Build directory disk usage:'
            echo '```'
            du -sh CoreELEC/build.* 2>/dev/null || true
            df -h "$GITHUB_WORKSPACE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

