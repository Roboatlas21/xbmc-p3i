name: One-shot p3i Kodi window fallback build

on:
  push:
    branches:
      - feat/coreelec-ng
    paths:
      - .github/workflows/build-kodi-p3i-window-fallback.yml

permissions:
  contents: read

jobs:
  build-kodi:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PROJECT: Amlogic-ce
      DEVICE: Amlogic-ng
      ARCH: arm
    steps:
      - name: Check out helper branch
        uses: actions/checkout@v4
        with:
          path: moonlight
          persist-credentials: false

      - name: Check out Pannal CoreELEC
        uses: actions/checkout@v4
        with:
          repository: pannal/CoreELEC
          ref: coreelec-21
          path: CoreELEC
          persist-credentials: false

      - name: Check out exact patched p3i Kodi source
        uses: actions/checkout@v4
        with:
          repository: Roboatlas21/xbmc-p3i
          ref: test/skin-reload-home-fallback-p3i
          path: CoreELEC/sources/kodi/xbmc-local
          fetch-depth: 2
          persist-credentials: false

      - name: Check out matching p3i Estuary source
        uses: actions/checkout@v4
        with:
          repository: pannal/skin.p3i.estuary
          ref: ab431aafa4e95141f52547c877a9d4cbe2ff7582
          path: CoreELEC/sources/skin.p3i.estuary/skin.p3i.estuary-local
          persist-credentials: false

      - name: Check out Pannal NG kernel and media modules
        uses: actions/checkout@v4
        with:
          repository: pannal/linux-amlogic
          ref: amlogic-4.9-20
          path: linux-amlogic-local
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: pannal/media_modules-aml
          ref: amlogic-4.9.269
          path: CoreELEC/sources/media_modules-aml/media_modules-aml-local
          persist-credentials: false

      - name: Wire local NG kernel source
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/linux-amlogic-local" "$HOME/linux-amlogic-local"

      - name: Reclaim runner disk and install host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 git make rsync bc gawk gperf gettext \
            libssl-dev libxml2-utils libxml-parser-perl groff unzip zip xz-utils \
            cpio patch curl file

      - name: Match today's portable p3i ARM32 build environment
        shell: bash
        run: |
          set -euo pipefail
          bash moonlight/packaging/coreelec-ng/patch-host-flags.sh "$GITHUB_WORKSPACE/CoreELEC"
          bash moonlight/packaging/coreelec-ng/fix-rtmpdump-source.sh "$GITHUB_WORKSPACE/CoreELEC" --fetch

      - name: Compute exact reusable p3i dependency-cache key
        id: keys
        shell: bash
        run: |
          set -euo pipefail
          {
            git -C CoreELEC rev-parse HEAD
            git -C linux-amlogic-local rev-parse HEAD
            git -C CoreELEC/sources/media_modules-aml/media_modules-aml-local rev-parse HEAD
            # Keep the historical ccache-off token so the existing dependency checkpoint still matches.
            # The compiler cache is restored and saved separately below.
            printf '%s\n' 'Amlogic-ce/Amlogic-ng/arm' 'ubuntu-24.04' 'ccache-off' 'cache-layout-v3-portable-x86-64'
            sha256sum moonlight/packaging/coreelec-ng/patch-host-flags.sh
          } > "$RUNNER_TEMP/ng-environment.txt"
          base="$(sha256sum "$RUNNER_TEMP/ng-environment.txt" | cut -c1-24)"
          recipe="$(cat moonlight/packaging/coreelec-ng/package.mk \
                         moonlight/packaging/coreelec-ng/fix-rtmpdump-source.sh \
                    | sha256sum | cut -c1-24)"
          echo "full=ce21-ng-deps-full-$base-$recipe" >> "$GITHUB_OUTPUT"
          echo "Expected full-cache key: ce21-ng-deps-full-$base-$recipe"

      - name: Restore today's completed p3i ARM32 dependency checkpoint
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            CoreELEC/build.*
            !CoreELEC/build.*/.ccache/**
            !CoreELEC/build.*/.ccache-local/**
          key: ${{ steps.keys.outputs.full }}

      - name: Require matching cached build tree
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.cache.outputs.cache-hit }}" = "true" || {
            echo "::error::Exact p3i ARM32 dependency cache from today's native build was not found."
            exit 1
          }
          echo "Reusing exact p3i ARM32 dependency checkpoint."

      - name: Restore Kodi/CoreELEC compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            CoreELEC/build.*/.ccache
            CoreELEC/build.*/.ccache-local
          key: ce21-ng-ccache-${{ steps.keys.outputs.full }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ce21-ng-ccache-${{ steps.keys.outputs.full }}-

      - name: Verify only the intended Kodi source delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C CoreELEC/sources/kodi/xbmc-local rev-parse HEAD)" = "0cb6c2cdbcd956e7dba99b6402f1275711647aee"
          test "$(git -C CoreELEC/sources/kodi/xbmc-local rev-parse HEAD^)" = "e984c6c6749c50887c4f7d2049e9f47ace49fe45"
          git -C CoreELEC/sources/kodi/xbmc-local diff --check HEAD^ HEAD
          git -C CoreELEC/sources/kodi/xbmc-local diff HEAD^ HEAD

      - name: Build only Kodi and its missing dependencies
        shell: bash
        timeout-minutes: 330
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/kodi-build.log"
          (
            while sleep 60 >/dev/null 2>&1; do
              echo "[kodi] still building; free disk: $(df -hP "$GITHUB_WORKSPACE/CoreELEC" | awk 'NR==2 {print $4}')"
            done
          ) &
          heartbeat=$!
          set +e
          (cd CoreELEC && ./scripts/build kodi) >"$log" 2>&1
          status=$?
          set -e
          kill "$heartbeat" 2>/dev/null || true
          wait "$heartbeat" 2>/dev/null || true
          if (( status != 0 )); then
            echo "::error::Kodi package build failed"
            grep -Einm 20 'fatal error:|(^|[[:space:]])error:|configure: error|CMake Error|undefined reference|No space left on device|cannot find|not found|FAILED:' "$log" | cut -c1-400 || true
            tail -n 120 "$log" | cut -c1-400
            exit "$status"
          fi
          tail -n 80 "$log"

      - name: Upload Kodi build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodi-p3i-window-fallback-build-log
          path: ${{ runner.temp }}/kodi-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Save Kodi/CoreELEC compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            CoreELEC/build.*/.ccache
            CoreELEC/build.*/.ccache-local
          key: ce21-ng-ccache-${{ steps.keys.outputs.full }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect patched kodi.bin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          mapfile -t bins < <(find CoreELEC/build.* -type f -path '*/install_pkg/kodi-*/usr/lib/kodi/kodi.bin' -print)
          if (( ${#bins[@]} != 1 )); then
            printf 'Found %d candidate kodi.bin files:\n' "${#bins[@]}"
            printf '%s\n' "${bins[@]}"
            exit 1
          fi
          cp "${bins[0]}" artifact/kodi.bin
          file artifact/kodi.bin
          file artifact/kodi.bin | grep -Eq 'ELF 32-bit.*ARM'
          chmod 755 artifact/kodi.bin
          {
            echo "CoreELEC=$(git -C CoreELEC rev-parse HEAD)"
            echo "KodiBase=e984c6c6749c50887c4f7d2049e9f47ace49fe45"
            echo "KodiPatched=0cb6c2cdbcd956e7dba99b6402f1275711647aee"
            echo "KodiBranch=test/skin-reload-home-fallback-p3i"
            echo "Target=PROJECT=Amlogic-ce DEVICE=Amlogic-ng ARCH=arm"
            echo "sha256=$(sha256sum artifact/kodi.bin | awk '{print $1}')"
            file artifact/kodi.bin
          } > artifact/build-info.txt
          cat artifact/build-info.txt

      - name: Upload temporary patched Kodi binary
        uses: actions/upload-artifact@v4
        with:
          name: kodi-p3i-window-fallback-arm32
          path: |
            artifact/kodi.bin
            artifact/build-info.txt
          if-no-files-found: error
          retention-days: 7

