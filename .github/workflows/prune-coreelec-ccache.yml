name: Prune CoreELEC compiler caches

on:
  push:
    branches:
      - maintenance/prune-coreelec-ccache
    paths:
      - .github/workflows/prune-coreelec-ccache.yml

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: List and delete compiler caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Caches before:"
          gh api --paginate             "/repos/$GITHUB_REPOSITORY/actions/caches?per_page=100"             --jq '.actions_caches[] | [.id,.key,.size_in_bytes] | @tsv'

          ids="$(gh api --paginate             "/repos/$GITHUB_REPOSITORY/actions/caches?per_page=100"             --jq '.actions_caches[] | select(.key | startswith("ce21-ng-ccache-")) | .id')"

          for id in $ids; do
            echo "Deleting compiler cache id $id"
            gh api --method DELETE               "/repos/$GITHUB_REPOSITORY/actions/caches/$id"
          done

          echo "Caches after:"
          gh api --paginate             "/repos/$GITHUB_REPOSITORY/actions/caches?per_page=100"             --jq '.actions_caches[] | [.id,.key,.size_in_bytes] | @tsv'
