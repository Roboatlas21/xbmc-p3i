name: Cancel current Kodi build pair

on:
  push:
    branches:
      - maintenance/cancel-kodi-runs-20261028
    paths:
      - .github/workflows/cancel-current-kodi-runs.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel current Kodi runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST repos/$GITHUB_REPOSITORY/actions/runs/40751110602/cancel || true
          gh api --method POST repos/$GITHUB_REPOSITORY/actions/runs/40751118938/cancel || true
