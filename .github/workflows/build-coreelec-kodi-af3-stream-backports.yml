# Build AF3 recovery v3 plus upstream stream backports with the exact AF3 environment
name: CoreELEC 21 ARM32 AF3 v3 and stream backports

on:
  pull_request:
    branches:
      - ci/public-coreelec-kodi-build
    paths:
      - .github/workflows/build-coreelec-kodi-af3-stream-backports.yml

permissions:
  contents: read

concurrency:
  group: public-coreelec-kodi-af3-stream-backports-v3
  cancel-in-progress: true

jobs:
  build-kodi:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PROJECT: Amlogic-ce
      DEVICE: Amlogic-ng
      ARCH: arm

    steps:
      - name: Check out workflow branch
        uses: actions/checkout@v4
        with:
          path: workflow
          persist-credentials: false

      - name: Check out Pannal CoreELEC
        uses: actions/checkout@v4
        with:
          repository: pannal/CoreELEC
          ref: 9a03483373f72f2eee129dc7b8d01f9abb6e6053
          path: CoreELEC
          persist-credentials: false

      - name: Check out combined fixes on the original AF3 v3 source
        uses: actions/checkout@v4
        with:
          repository: Roboatlas21/xbmc-p3i
          ref: 6316ceef8df1f2a7d1c941fd64c99017ba816e87
          path: CoreELEC/sources/kodi/xbmc-local
          fetch-depth: 6
          persist-credentials: false

      - name: Check out matching p3i Estuary source
        uses: actions/checkout@v4
        with:
          repository: pannal/skin.p3i.estuary
          ref: ab431aafa4e95141f52547c877a9d4cbe2ff7582
          path: CoreELEC/sources/skin.p3i.estuary/skin.p3i.estuary-local
          persist-credentials: false

      - name: Check out Pannal NG kernel and media modules
        uses: actions/checkout@v4
        with:
          repository: pannal/linux-amlogic
          ref: 19909065f6919cc34a1ba20b44441a4e9f02bc5a
          path: linux-amlogic-local
          persist-credentials: false

      - name: Check out Pannal media modules
        uses: actions/checkout@v4
        with:
          repository: pannal/media_modules-aml
          ref: 47d0ec45bbc2d659d675e3a0269788be1470e1f7
          path: CoreELEC/sources/media_modules-aml/media_modules-aml-local
          persist-credentials: false

      - name: Wire local NG kernel source
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/linux-amlogic-local" "$HOME/linux-amlogic-local"

      - name: Reclaim runner disk and install host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 git make rsync bc gawk gperf gettext \
            libssl-dev libxml2-utils libxml-parser-perl libparse-yapp-perl groff unzip zip xz-utils \
            cpio patch curl file lzop
          df -hP "$GITHUB_WORKSPACE"

      - name: Configure portable CoreELEC build
        shell: bash
        run: |
          set -euo pipefail
          bash workflow/.github/scripts/coreelec/patch-host-flags.sh "$GITHUB_WORKSPACE/CoreELEC"
          bash workflow/.github/scripts/coreelec/fix-rtmpdump-source.sh "$GITHUB_WORKSPACE/CoreELEC" --fetch
          mkdir -p CoreELEC/.coreelec
          printf '%s\n' 'CCACHE_CACHE_SIZE="7G"' > CoreELEC/.coreelec/options

      - name: Compute reusable cache keys
        id: keys
        shell: bash
        run: |
          set -euo pipefail
          {
            git -C CoreELEC rev-parse HEAD
            git -C linux-amlogic-local rev-parse HEAD
            git -C CoreELEC/sources/media_modules-aml/media_modules-aml-local rev-parse HEAD
            printf '%s\n' 'Amlogic-ce/Amlogic-ng/arm' 'ubuntu-24.04' 'public-build-v1' 'portable-x86-64'
            sha256sum workflow/.github/scripts/coreelec/patch-host-flags.sh
            sha256sum workflow/.github/scripts/coreelec/fix-rtmpdump-source.sh
          } > "$RUNNER_TEMP/coreelec-environment.txt"

          base="$(sha256sum "$RUNNER_TEMP/coreelec-environment.txt" | cut -c1-24)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Cache environment: $base"
          test "$base" = "8b2255a8344b2ba251751d81" || {
            echo "::error::Previous build's cache environment changed; refusing an uncached rebuild."
            exit 1
          }

      - name: Restore shared CoreELEC dependency state
        id: coreelec-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            CoreELEC/build.*/toolchain
            CoreELEC/build.*/.stamps
            CoreELEC/build.*/build/groovy-*
            CoreELEC/build.*/build/commons-lang3-*
            CoreELEC/build.*/build/commons-text-*
          key: ce21-ng-depstate-v2-${{ steps.keys.outputs.base }}-40801991884-1

      - name: Restore shared compiler cache
        id: coreelec-ccache
        uses: actions/cache/restore@v4
        with:
          path: |
            CoreELEC/build.*/.ccache
            CoreELEC/build.*/.ccache-local
          key: ce21-ng-ccache-${{ steps.keys.outputs.base }}-40801991884-1

      - name: Require the exact AF3 dependency and compiler caches
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.coreelec-deps.outputs.cache-hit }}' = 'true'
          test '${{ steps.coreelec-ccache.outputs.cache-hit }}' = 'true'
          shopt -s nullglob
          builds=(CoreELEC/build.*)
          if (( ${#builds[@]} != 1 )); then
            echo "::error::No reusable CoreELEC dependency build directory. Stopping rather than rebuilding toolchain."
            exit 1
          fi
          b="${builds[0]}"
          if [[ ! -d "$b/toolchain" || ! -d "$b/.stamps" ]]; then
            echo "::error::Dependency cache is missing toolchain/stamps. Stopping instead of full toolchain build."
            exit 1
          fi
          if [[ ! -d "$b/.ccache" && ! -d "$b/.ccache-local" ]]; then
            echo "::error::Previous compiler cache was not restored. Stopping instead of slow recompilation."
            exit 1
          fi
          echo "Using cached dependencies and compiler data:"
          du -sh "$b/toolchain" "$b/.stamps" "$b/.ccache" "$b/.ccache-local" 2>/dev/null || true

      - name: One-time reset interrupted CMake build
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          build_dirs=(CoreELEC/build.*)

          if (( ${#build_dirs[@]} == 0 )); then
            echo "No restored CoreELEC build tree; no CMake reset needed"
            exit 0
          fi

          if (( ${#build_dirs[@]} != 1 )); then
            printf 'Expected one CoreELEC build tree, found %d:\n' "${#build_dirs[@]}"
            printf '%s\n' "${build_dirs[@]}"
            exit 1
          fi

          marker="${build_dirs[0]}/.ci-cmake-reset-v1"

          if [[ ! -f "$marker" ]]; then
            echo "Cleaning interrupted host CMake build once"
            (cd CoreELEC && ./scripts/clean cmake)
            touch "$marker"
          else
            echo "CMake reset already applied; keeping cached CMake state"
          fi

      - name: Verify both fixes and the unchanged AF3 base
        shell: bash
        run: |
          set -euo pipefail
          src=CoreELEC/sources/kodi/xbmc-local
          test "$(git -C "$src" rev-parse HEAD)" = "6316ceef8df1f2a7d1c941fd64c99017ba816e87"
          test "$(git -C "$src" rev-parse HEAD~3)" = "5ade34be1cda516f42b7323d014c3e79d50fcc7a"
          test "$(git -C "$src" rev-parse HEAD~5)" = "6adbc689c19bab0b094b029e329015e9cea7de1b"
          test "$(git -C "$src" rev-list --count 5ade34be..HEAD)" = "3"
          git -C "$src" diff --exit-code 5ade34be HEAD -- xbmc/application/ApplicationSkinHandling.cpp
          test "$(git -C "$src" diff --name-only 5ade34be HEAD | wc -l)" = "12"
          if git -C "$src" diff --name-only 5ade34be HEAD | grep -v '^xbmc/cores/VideoPlayer/'; then
            echo "::error::Unexpected changes outside the three playback backports."
            exit 1
          fi
          grep -Fq "Previous window {} is unavailable or is now a dialog after skin load; activating Home" "$src/xbmc/application/ApplicationSkinHandling.cpp"
          grep -Fq "Skin load left no valid active window; activating Home" "$src/xbmc/application/ApplicationSkinHandling.cpp"
          git -C "$src" log 5ade34be..HEAD --format=%B > "$RUNNER_TEMP/backport-commits.txt"
          for commit in c168ae8b1418d74b10498566674fbbc8d087bb74 453dfcd8597931867408a22ed870405f0bac7cca 9fe55278ba14e1ffba9e1c0b672b25054e3ad2c7; do
            grep -Fq "$commit" "$RUNNER_TEMP/backport-commits.txt"
          done
          git -C "$src" diff --check 5ade34be HEAD
          git -C "$src" diff --stat 5ade34be HEAD

      - name: Clean Kodi package for exact-source rebuild
        shell: bash
        run: |
          set -euo pipefail
          (cd CoreELEC && ./scripts/clean kodi)

      - name: Build Kodi and missing CoreELEC dependencies
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/kodi-build.log"

          (
            while sleep 60 >/dev/null 2>&1; do
              echo "[kodi] still building; free disk: $(df -hP "$GITHUB_WORKSPACE/CoreELEC" | awk 'NR==2 {print $4}')"
            done
          ) &
          heartbeat=$!

          set +e
          (cd CoreELEC && timeout --signal=TERM --kill-after=30s 55m ./scripts/build kodi) >"$log" 2>&1
          status=$?
          set -e

          kill "$heartbeat" 2>/dev/null || true
          wait "$heartbeat" 2>/dev/null || true

          if (( status != 0 )); then
            echo "::error::Kodi package build failed"
            grep -Einm 30 'fatal error:|(^|[[:space:]])error:|configure: error|CMake Error|undefined reference|No space left on device|cannot find|not found|FAILED:' "$log" | cut -c1-400 || true
            tail -n 160 "$log" | cut -c1-400
            exit "$status"
          fi

          tail -n 100 "$log"

      - name: Upload Kodi build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kodi-p3i-public-build-log
          path: ${{ runner.temp }}/kodi-build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Report reusable cache footprint
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          build_dirs=(CoreELEC/build.*)
          if (( ${#build_dirs[@]} == 1 )); then
            echo "Reusable CoreELEC dependency state:"
            du -sch \
              "${build_dirs[0]}/toolchain" \
              "${build_dirs[0]}/.stamps" \
              "${build_dirs[0]}"/build/groovy-* \
              "${build_dirs[0]}"/build/commons-lang3-* \
              "${build_dirs[0]}"/build/commons-text-* \
              2>/dev/null || true
            echo "Shared compiler cache:"
            du -sch "${build_dirs[0]}/.ccache" "${build_dirs[0]}/.ccache-local" 2>/dev/null || true
          fi

      # Restore the existing CI branch caches, but do not save duplicate caches from this PR build.

      - name: Collect patched kodi.bin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          mapfile -t bins < <(find CoreELEC/build.* -type f -path '*/install_pkg/kodi-*/usr/lib/kodi/kodi.bin' -print)
          if (( ${#bins[@]} != 1 )); then
            printf 'Found %d candidate kodi.bin files:\n' "${#bins[@]}"
            printf '%s\n' "${bins[@]}"
            exit 1
          fi

          cp "${bins[0]}" artifact/kodi.bin
          file artifact/kodi.bin
          file artifact/kodi.bin | grep -Eq 'ELF 32-bit.*ARM'
          chmod 755 artifact/kodi.bin

          {
            echo "CoreELEC=$(git -C CoreELEC rev-parse HEAD)"
            echo "KodiBase=6adbc689c19bab0b094b029e329015e9cea7de1b"
            echo "AF3Source=5ade34be1cda516f42b7323d014c3e79d50fcc7a"
            echo "KodiPatched=6316ceef8df1f2a7d1c941fd64c99017ba816e87"
            echo "KodiBranch=test/skin-reload-stream-selection-p3i-arm32-v3"
            echo "UpstreamBackports=c168ae8b1418d74b10498566674fbbc8d087bb74 453dfcd8597931867408a22ed870405f0bac7cca 9fe55278ba14e1ffba9e1c0b672b25054e3ad2c7"
            echo "DependencyCache=${{ steps.coreelec-deps.outputs.cache-matched-key }}"
            echo "CompilerCache=${{ steps.coreelec-ccache.outputs.cache-matched-key }}"
            echo "Target=PROJECT=Amlogic-ce DEVICE=Amlogic-ng ARCH=arm"
            echo "sha256=$(sha256sum artifact/kodi.bin | awk '{print $1}')"
            file artifact/kodi.bin
          } > artifact/build-info.txt

          sha256sum artifact/kodi.bin > artifact/kodi.bin.sha256
          cat artifact/build-info.txt
          cat artifact/kodi.bin.sha256

      - name: Upload patched Kodi binary
        uses: actions/upload-artifact@v4
        with:
          name: kodi-p3i-af3-stream-backports-arm32-v3
          path: |
            artifact/kodi.bin
            artifact/build-info.txt
            artifact/kodi.bin.sha256
          if-no-files-found: error
          retention-days: 7

